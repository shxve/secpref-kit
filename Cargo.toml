[package]
name = "secpref-kit"
version = "0.2.0-dev"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust library for Chromium Secure Preferences integrity: HMACs, extension IDs, DataPack seed extraction, manifests, and preference mutation."
repository = "https://github.com/shxve/secpref-kit"
homepage = "https://github.com/shxve/secpref-kit"
readme = "README.md"
keywords = ["chromium", "chrome", "security", "browser", "hmac"]
categories = ["cryptography", "development-tools"]
authors = ["shxve <shxve@users.noreply.github.com>"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# Preserve parsed preference-file order for loss-minimizing in-memory mutation.
# MAC canonicalization sorts cloned dictionary values explicitly to match
# Chromium's base::Value::Dict semantics.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
dunce = "1"

# --- Windows SID helpers (src/sid.rs, #[cfg(windows)]) ---
# Windows-only, always available on Windows builds. No feature flag —
# matches Lester/CDP-Enabler pattern (`#[cfg(windows)]` gating instead).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
